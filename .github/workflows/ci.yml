name: CI

on:
  push:
    branches: [main, repayx-fullstack]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Backend + ML tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            ml/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        # Real-data acceptance tests skip themselves: the dataset and generated artifacts are not in the repo.
        run: python -m pytest -q -W error -rs
      - name: ML tests
        working-directory: ml
        run: python -m pytest -q -W error

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
